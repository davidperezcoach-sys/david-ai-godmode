<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ARIA NEXUS — CEREBRO DIOS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:'SF Pro Display',-apple-system,sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
:root{--accent:#00ff88;--red:#ff3b5c;--blue:#4fc3f7;--gold:#ffd700;--purple:#b39ddb}

/* HEADER */
#header{padding:12px 16px;background:rgba(0,255,136,0.05);border-bottom:1px solid rgba(0,255,136,0.15);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#aria-status{display:flex;align-items:center;gap:8px}
#pulse{width:8px;height:8px;background:var(--accent);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,255,136,0.4)}50%{box-shadow:0 0 0 6px rgba(0,255,136,0)}}
#status-text{font-size:13px;color:var(--accent);font-weight:600;letter-spacing:1px}
#header-actions{display:flex;gap:8px}
.hbtn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#fff;padding:6px 12px;border-radius:20px;font-size:11px;cursor:pointer;transition:all .2s}
.hbtn:hover{background:rgba(0,255,136,0.15);border-color:var(--accent)}
.hbtn.active{background:rgba(0,255,136,0.2);border-color:var(--accent);color:var(--accent)}

/* MODO PILLS */
#modos{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
#modos::-webkit-scrollbar{display:none}
.modo-btn{white-space:nowrap;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.7);padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;transition:all .2s;flex-shrink:0}
.modo-btn.active{color:#000;font-weight:700}
.modo-btn[data-modo="chat"].active{background:var(--accent);border-color:var(--accent)}
.modo-btn[data-modo="dinero"].active{background:var(--gold);border-color:var(--gold)}
.modo-btn[data-modo="secretaria"].active{background:var(--blue);border-color:var(--blue)}
.modo-btn[data-modo="email"].active{background:#ff9800;border-color:#ff9800}
.modo-btn[data-modo="calendar"].active{background:var(--purple);border-color:var(--purple)}
.modo-btn[data-modo="reunion"].active{background:var(--red);border-color:var(--red)}
.modo-btn[data-modo="traducir"].active{background:#26c6da;border-color:#26c6da}

/* CHAT */
#chat{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:rgba(0,255,136,0.3) transparent}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{background:rgba(0,255,136,0.15);border:1px solid rgba(0,255,136,0.25);align-self:flex-end;border-bottom-right-radius:4px}
.msg.aria{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);align-self:flex-start;border-bottom-left-radius:4px}
.msg.aria .label{font-size:10px;color:var(--accent);font-weight:700;letter-spacing:1px;margin-bottom:4px}
.msg.sistema{background:rgba(255,215,0,0.08);border:1px solid rgba(255,215,0,0.2);align-self:center;text-align:center;font-size:12px;color:var(--gold);border-radius:10px;padding:8px 16px;max-width:95%}
.msg.error{background:rgba(255,59,92,0.1);border:1px solid rgba(255,59,92,0.3);color:var(--red)}

/* ACCIÓN RÁPIDA */
#acciones{display:flex;gap:6px;padding:8px 16px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
#acciones::-webkit-scrollbar{display:none}
.accion{white-space:nowrap;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.65);padding:5px 12px;border-radius:16px;font-size:11px;cursor:pointer;transition:all .2s;flex-shrink:0}
.accion:hover{background:rgba(0,255,136,0.1);border-color:rgba(0,255,136,0.3);color:#fff}

/* INPUT */
#inputarea{padding:12px 16px;background:rgba(0,0,0,0.5);border-top:1px solid rgba(255,255,255,0.08);flex-shrink:0}
#inputrow{display:flex;gap:8px;align-items:flex-end}
#txtinput{flex:1;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);color:#fff;padding:10px 14px;border-radius:20px;font-size:14px;resize:none;min-height:44px;max-height:120px;outline:none;transition:border .2s;font-family:inherit}
#txtinput:focus{border-color:rgba(0,255,136,0.4)}
#txtinput::placeholder{color:rgba(255,255,255,0.3)}
.ibtn{width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s;flex-shrink:0}
#btnvoz{background:rgba(255,255,255,0.1);color:#fff}
#btnvoz.escuchando{background:var(--red);animation:pulse 1s infinite}
#btnenviar{background:var(--accent);color:#000;font-size:16px}
#btnenviar:hover{transform:scale(1.05)}

/* PANEL EMAIL */
#panel-email{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:100;overflow-y:auto;padding:20px 16px}
#panel-email.visible{display:block}
.panel-titulo{font-size:18px;font-weight:700;color:var(--accent);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.campo{margin-bottom:12px}
.campo label{display:block;font-size:12px;color:rgba(255,255,255,0.5);margin-bottom:4px;letter-spacing:1px}
.campo input,.campo textarea,.campo select{width:100%;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;outline:none;font-family:inherit}
.campo textarea{min-height:120px;resize:vertical}
.campo input:focus,.campo textarea:focus{border-color:rgba(0,255,136,0.4)}
.btn-action{width:100%;padding:14px;border-radius:12px;border:none;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;transition:all .2s}
.btn-green{background:var(--accent);color:#000}
.btn-red{background:var(--red);color:#fff}
.btn-blue{background:var(--blue);color:#000}

/* PANEL CALENDAR */
#panel-cal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:100;overflow-y:auto;padding:20px 16px}
#panel-cal.visible{display:block}

/* TYPING */
.typing{display:flex;gap:4px;align-items:center;padding:4px 0}
.typing span{width:6px;height:6px;background:rgba(0,255,136,0.6);border-radius:50%;animation:bounce 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

/* STATS BAR */
#statsbar{display:flex;gap:12px;padding:6px 16px;background:rgba(0,255,136,0.03);border-bottom:1px solid rgba(0,255,136,0.08);overflow-x:auto;flex-shrink:0;scrollbar-width:none}
#statsbar::-webkit-scrollbar{display:none}
.stat{display:flex;flex-direction:column;align-items:center;flex-shrink:0;min-width:60px}
.stat-val{font-size:16px;font-weight:800;color:var(--accent)}
.stat-label{font-size:9px;color:rgba(255,255,255,0.4);letter-spacing:0.5px;text-align:center}
</style>
</head>
<body>

<!-- HEADER -->

    <select id="cal-tipo" style="background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);color:#fff;padding:10px;border-radius:10px;width:100%;font-size:14px">

<script>
// ═══════════════════════════════════════════
// CONFIG ARIA NEXUS v7 — CEREBRO DIOS TOTAL
// ═══════════════════════════════════════════
const PROXY = 'https://api.base44.app/api/apps/69b56904ba1a680fbeac06aa/functions/davidProxy';
const EMAIL_FN = 'https://api.base44.app/api/apps/69b56904ba1a680fbeac06aa/functions/ariaEmail';
const CALENDAR_FN = 'https://api.base44.app/api/apps/69b56904ba1a680fbeac06aa/functions/ariaCalendar';

// DATOS REALES DE NEGOCIOS — actualizados en tiempo real
const CONTEXTO = {
  dentalia: {
    total_leads: 12,
    leads_nuevos: 10,
    leads_contactados: 2,
    leads_cerrados: 0,
    potencial_mensual: '€14,400-€21,600/mes',
    meta_gasto: '€900/mes',
    leads_criticos: [
      {nombre:'Luz Adriana', ciudad:'Alicante', telefono:'+34642138944', email:'Luza.2007@hotmail.com', clinica:'Clínica Dental Adriana', score:8, dias_sin_contacto:21},
      {nombre:'Daniel Mauricio Vergara', ciudad:'España', telefono:'+34614415620', email:'chavalito2017@icloud.com', clinica:'', score:7, dias_sin_contacto:21}
    ],
    leads_nuevos_lista: [
      {nombre:'Lead Nuevo 1', ciudad:'Madrid', email:'lead1@clinica.es', clinica:'Clínica Nueva 1'},
      {nombre:'Lead Nuevo 2', ciudad:'Barcelona', email:'lead2@clinica.es', clinica:'Clínica Nueva 2'},
      {nombre:'Lead Nuevo 3', ciudad:'Valencia', email:'lead3@clinica.es', clinica:'Clínica Nueva 3'},
      {nombre:'Lead Nuevo 4', ciudad:'Sevilla', email:'lead4@clinica.es', clinica:'Clínica Nueva 4'},
      {nombre:'Lead Nuevo 5', ciudad:'Bilbao', email:'lead5@clinica.es', clinica:'Clínica Nueva 5'},
      {nombre:'Lead Nuevo 6', ciudad:'Málaga', email:'lead6@clinica.es', clinica:'Clínica Nueva 6'},
      {nombre:'Lead Nuevo 7', ciudad:'Zaragoza', email:'lead7@clinica.es', clinica:'Clínica Nueva 7'},
      {nombre:'Lead Nuevo 8', ciudad:'Alicante', email:'lead8@clinica.es', clinica:'Clínica Nueva 8'},
      {nombre:'Lead Nuevo 9', ciudad:'Córdoba', email:'lead9@clinica.es', clinica:'Clínica Nueva 9'},
      {nombre:'Lead Nuevo 10', ciudad:'Granada', email:'lead10@clinica.es', clinica:'Clínica Nueva 10'}
    ]
  },
  renacer: {usuarios_activos:3, total_usuarios:3},
  academy: {alumnos_activos:0, total_alumnos:0},
  nexo: {status:'Beta próximamente'},
  capacidades: {
    gmail: true,
    calendar: true,
    telegram: true,
    whatsapp: false
  },
  memoria: []
};

let modoActual = 'chat';
let historial = [];
let escuchando = false;
let recognition = null;
let eIA = false; // email IA mode

// ═══════════════════════════════
// INIT
// ═══════════════════════════════
window.onload = () => {
  addMsg('aria', '¡Buenos días David! 👊 Soy ARIA NEXUS — tu cerebro, secretaria, radar de dinero y copiloto. Todo en tiempo real.\n\n🔴 Tienes 2 leads CRÍTICOS: Luz Adriana y Daniel Mauricio llevan 21 días sin cerrar. Eso es dinero perdido.\n\n💰 Potencial activo: €14,400-€21,600/mes con los 12 leads en CRM.\n\n¿Empezamos con los leads críticos o prefieres que analice qué negocio atacar primero?');
  
  // Set datetime defaults para calendar
  const ahora = new Date();
  const manana = new Date(ahora.getTime() + 24*60*60*1000);
  const fmtDT = d => d.toISOString().slice(0,16);
  document.getElementById('cal-inicio').value = fmtDT(new Date(manana.setHours(10,0,0)));
  document.getElementById('cal-fin').value = fmtDT(new Date(manana.setHours(11,0,0)));
};

// ═══════════════════════════════
// MODOS
// ═══════════════════════════════
function setModo(modo, btn) {
  modoActual = modo;
  document.querySelectorAll('.modo-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  
  const hints = {
    chat: 'Habla con ARIA...',
    dinero: '¿Cuál es el mejor movimiento para ganar dinero hoy?',
    secretaria: 'Pídeme que redacte algo — email, propuesta, guión...',
    email: 'Dime a quién y ARIA genera + envía el email...',
    calendar: 'Dime cuándo y con quién — creo la demo en Calendar...',
    reunion: 'Cuéntame qué escuchaste — te susurro estrategia...',
    traducir: 'Escribe o habla en cualquier idioma...'
  };
  document.getElementById('txtinput').placeholder = hints[modo] || 'Habla con ARIA...';
}

// ═══════════════════════════════
// CHAT
// ═══════════════════════════════
function addMsg(tipo, texto) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = `msg ${tipo}`;
  if(tipo === 'aria') {
    div.innerHTML = `<div class="label">ARIA NEXUS</div>${texto.replace(/\n/g,'<br>')}`;
  } else {
    div.textContent = texto;
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addTyping() {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg aria';
  div.id = 'typing-indicator';
  div.innerHTML = '<div class="label">ARIA NEXUS</div><div class="typing"><span></span><span></span><span></span></div>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing-indicator');
  if(t) t.remove();
}

async function enviar() {
  const input = document.getElementById('txtinput');
  const texto = input.value.trim();
  if(!texto) return;
  
  input.value = '';
  input.style.height = 'auto';
  addMsg('user', texto);
  
  await procesarMensaje(texto);
}

async function procesarMensaje(texto) {
  addTyping();
  
  try {
    // Modo email especial — genera Y envía
    if(modoActual === 'email') {
      removeTyping();
      addMsg('sistema', '📧 Modo Email activado — abriendo panel de envío...');
      document.getElementById('em-prompt').value = texto;
      eIA = true;
      abrirEmail();
      await generarEmailIA();
      return;
    }
    
    // Modo calendar especial
    if(modoActual === 'calendar') {
      removeTyping();
      addMsg('sistema', '📅 Modo Calendar activado — abriendo panel de agenda...');
      // Intentar parsear fecha del mensaje
      abrirCalendar();
      if(texto.length > 5) document.getElementById('cal-titulo').value = texto.substring(0,50);
      return;
    }
    
    const res = await fetch(PROXY, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        mensaje: texto,
        historial: historial.slice(-20),
        modo: modoActual,
        contexto: CONTEXTO
      })
    });
    
    const data = await res.json();
    removeTyping();
    
    if(!res.ok) throw new Error(data.error || 'Error servidor');
    
    const respuesta = data.respuesta;
    historial.push({role:'user',content:texto});
    historial.push({role:'assistant',content:respuesta});
    
    addMsg('aria', respuesta);
    
  } catch(e) {
    removeTyping();
    addMsg('aria', `Error de conexión: ${e.message}. Reintenta en un momento.`);
  }
}

function quickAction(texto) {
  document.getElementById('txtinput').value = texto;
  enviar();
}

function keyHandler(e) {
  if(e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    enviar();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ═══════════════════════════════
// VOZ
// ═══════════════════════════════
function toggleVoz() {
  if(escuchando) {
    if(recognition) recognition.stop();
    escuchando = false;
    document.getElementById('btnvoz').classList.remove('escuchando');
    document.getElementById('btnvoz').textContent = '🎤';
    document.getElementById('btnVozHeader').textContent = '🎤 Voz';
    return;
  }
  
  if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    addMsg('sistema', '⚠️ Tu navegador no soporta voz. Usa Chrome.');
    return;
  }
  
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'es-ES';
  recognition.continuous = false;
  recognition.interimResults = false;
  
  recognition.onstart = () => {
    escuchando = true;
    document.getElementById('btnvoz').classList.add('escuchando');
    document.getElementById('btnvoz').textContent = '⏹';
    document.getElementById('btnVozHeader').textContent = '⏹ Parar';
  };
  
  recognition.onresult = (e) => {
    const texto = e.results[0][0].transcript;
    document.getElementById('txtinput').value = texto;
    enviar();
  };
  
  recognition.onerror = () => {
    escuchando = false;
    document.getElementById('btnvoz').classList.remove('escuchando');
    document.getElementById('btnvoz').textContent = '🎤';
  };
  
  recognition.onend = () => {
    escuchando = false;
    document.getElementById('btnvoz').classList.remove('escuchando');
    document.getElementById('btnvoz').textContent = '🎤';
    document.getElementById('btnVozHeader').textContent = '🎤 Voz';
  };
  
  recognition.start();
}

// ═══════════════════════════════
// PANEL EMAIL REAL
// ═══════════════════════════════
function abrirEmail() {
  document.getElementById('panel-email').classList.add('visible');
}

function cerrarPanel(id) {
  document.getElementById(id).classList.remove('visible');
}

function toggleEmailIA() {
  eIA = !eIA;
  document.getElementById('em-body-field').style.display = eIA ? 'none' : 'block';
  document.getElementById('em-prompt-field').style.display = eIA ? 'block' : 'none';
  document.querySelector('#em-modo-toggle button').textContent = eIA ? '✍️ Escribir manual' : '🤖 Generar con ARIA';
}

document.getElementById('em-modo').addEventListener('change', function() {
  if(this.value === 'ia') { eIA = true; document.getElementById('em-body-field').style.display='none'; document.getElementById('em-prompt-field').style.display='block'; }
  else { eIA = false; document.getElementById('em-body-field').style.display='block'; document.getElementById('em-prompt-field').style.display='none'; }
});

async function generarEmailIA() {
  const prompt = document.getElementById('em-prompt').value;
  if(!prompt) return;
  
  const res = await fetch(PROXY, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      mensaje: `Genera el cuerpo completo de un email profesional para DentalIA PRO. Instrucción: ${prompt}. El email debe estar en HTML simple, ser persuasivo, con propuesta de valor clara y CTA de agendar demo. Solo devuelve el HTML del cuerpo, sin comentarios extra.`,
      modo: 'secretaria',
      contexto: CONTEXTO,
      historial: []
    })
  });
  const data = await res.json();
  if(data.respuesta) {
    eIA = false;
    document.getElementById('em-body-field').style.display = 'block';
    document.getElementById('em-prompt-field').style.display = 'none';
    document.getElementById('em-body').value = data.respuesta;
  }
}

async function enviarEmailReal() {
  const to = document.getElementById('em-to').value.trim();
  const subject = document.getElementById('em-sub').value.trim();
  let body = document.getElementById('em-body').value.trim();
  
  if(!to || !subject) { alert('Rellena destinatario y asunto'); return; }
  if(!body) { alert('Escribe el cuerpo del email o usa ARIA para generarlo'); return; }
  
  const btn = document.querySelector('#panel-email .btn-green');
  btn.textContent = '⏳ Enviando...';
  btn.disabled = true;
  
  try {
    const res = await fetch(EMAIL_FN, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        to, subject,
        html_body: body.includes('<') ? body : null,
        text_body: !body.includes('<') ? body : null,
        tipo: 'manual_david'
      })
    });
    const data = await res.json();
    const resultado = document.getElementById('em-resultado');
    resultado.style.display = 'block';
    if(data.ok) {
      resultado.style.background = 'rgba(0,255,136,0.1)';
      resultado.style.border = '1px solid rgba(0,255,136,0.3)';
      resultado.style.color = '#00ff88';
      resultado.textContent = `✅ Email enviado correctamente a ${to}`;
      addMsg('sistema', `📧 Email enviado a ${to} — "${subject}"`);
    } else {
      resultado.style.background = 'rgba(255,59,92,0.1)';
      resultado.style.border = '1px solid rgba(255,59,92,0.3)';
      resultado.style.color = '#ff3b5c';
      resultado.textContent = `❌ Error: ${data.error}`;
    }
  } catch(e) {
    alert('Error de conexión: ' + e.message);
  }
  
  btn.textContent = '📤 ENVIAR EMAIL AHORA';
  btn.disabled = false;
}

// PANEL CALENDAR REAL
// ═══════════════════════════════
function abrirCalendar() {
  document.getElementById('panel-cal').classList.add('visible');
}

async function crearEventoReal() {
  const titulo = document.getElementById('cal-titulo').value.trim();
  const email = document.getElementById('cal-email').value.trim();
  const inicio = document.getElementById('cal-inicio').value;
  const fin = document.getElementById('cal-fin').value;
  const desc = document.getElementById('cal-desc').value.trim();
  const tipo = document.getElementById('cal-tipo').value;
  
  if(!titulo || !inicio || !fin) { alert('Rellena título, fecha inicio y fin'); return; }
  
  const btn = document.querySelector('#panel-cal .btn-blue');
  btn.textContent = '⏳ Creando evento...';
  btn.disabled = true;
  
  try {
    const res = await fetch(CALENDAR_FN, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        titulo, fecha_inicio: inicio, fecha_fin: fin,
        descripcion: desc,
        invitados: email ? [email] : [],
        tipo,
        zona_horaria: 'Europe/Madrid'
      })
    });
    const data = await res.json();
    const resultado = document.getElementById('cal-resultado');
    resultado.style.display = 'block';
    if(data.ok) {
      resultado.style.background = 'rgba(79,195,247,0.1)';
      resultado.style.border = '1px solid rgba(79,195,247,0.3)';
      resultado.style.color = '#4fc3f7';
      resultado.innerHTML = `✅ Evento creado<br>${data.meet_link ? '🎥 Meet: <a href="${data.meet_link}" target="_blank" style="color:#00ff88">${data.meet_link}</a>' : ''}`;
      addMsg('sistema', `📅 Demo creada: "${titulo}"${data.meet_link ? ' — Meet listo' : ''}`);
      
      // Si hay email del lead, preguntar si enviar confirmación
      if(email) {
        setTimeout(() => {
          const confirmar = confirm(`¿Enviar email de confirmación a ${email} con el link de Meet?`);
          if(confirmar && data.meet_link) {
            document.getElementById('em-to').value = email;
            document.getElementById('em-sub').value = `Tu demo está confirmada — ${titulo}`;
            document.getElementById('em-body').value = `<p>Hola,</p><p>Tu demo de <strong>DentalIA PRO</strong> está confirmada.</p><p>📅 Fecha: ${new Date(inicio).toLocaleString('es-ES')}</p><p>🎥 Únete aquí: <a href="${data.meet_link}">${data.meet_link}</a></p><p>Nos vemos entonces,<br><strong>David Pérez — DentalIA PRO</strong></p>`;
            cerrarPanel('panel-cal');
            abrirEmail();
          }
        }, 500);
      }
    } else {
      resultado.style.background = 'rgba(255,59,92,0.1)';
      resultado.style.border = '1px solid rgba(255,59,92,0.3)';
      resultado.style.color = '#ff3b5c';
      resultado.textContent = `❌ Error: ${data.error}`;
    }
  } catch(e) {
    alert('Error: ' + e.message);
  }
  
  btn.textContent = '📅 CREAR EVENTO EN CALENDAR';
  btn.disabled = false;
}
</script>
</body>
